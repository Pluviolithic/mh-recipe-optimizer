[project]
name = "mh-recipe-optimizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "argparse>=1.4",
    "beautifulsoup4>=4.13.3",
    "bs4>=0.0.2",
    "defusedxml>=0.7.1",
    "pulp>=2.9",
    "requests>=2.32.3",
    "toml>=0.10.2",
]

scripts.optimize = "optimize:main"

[dependency-groups]
dev = [
    "prek>=0.2.13",
    "pyproject-fmt>=2.11.1",
    "ruff==0.14.4",
    "ty==0.0.1a25",
]

[tool.uv]
package = true

[tool.ruff]
lint.select = [ "ALL" ]
lint.ignore = [ "ANN401", "COM812", "D", "T201" ]
